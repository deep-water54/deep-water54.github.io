<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>АкваДом — энциклопедия</title>
  <style>
    :root {
      --ink: #222; --muted: #777; --red: #e63946; --red-dark: #c1121f;
      --bg: #fcfcfc; --line: #eee; --shadow: 0 10px 30px rgba(0,0,0,.08);
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--bg); font-family: system-ui, sans-serif; line-height: 1.5; }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; }
    .container { width: min(1200px, calc(100% - 40px)); margin-inline: auto; }

    /* Шапка */
    .site-header { background: var(--red); color: white; padding: 15px 0; position: sticky; top: 0; z-index: 50; }
    .nav { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .brand { font-size: 1.4rem; font-weight: 800; }
    .nav-links { display: flex; gap: 20px; font-weight: 600; }
    .nav-links a { padding: 8px 12px; border-radius: 8px; }
    .nav-links a:hover { background: rgba(255,255,255,.2); }

    /* Баннер */
    .hero { padding: 40px 0; text-align: center; background: white; border-bottom: 1px solid var(--line); }
    .hero h1 { margin: 0 0 10px; font-size: 2.5rem; color: var(--red); }

    /* Сетка */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 25px; padding: 40px 0; }
    .card { background: white; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: 0.2s; }
    .card:hover { transform: translateY(-5px); box-shadow: var(--shadow); }
    .card-img { height: 180px; background: #f0f0f0; display: grid; place-items: center; }
    .card-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .card-body { padding: 15px; }
    .card-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 5px; }
    .card-desc { color: var(--muted); font-size: 0.85rem; }
    .btn-view { background: var(--red); color: white; border: 0; border-radius: 8px; padding: 8px 15px; margin-top: 10px; }

    /* Модалка */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: 0.3s; display: flex; align-items: flex-end; justify-content: center; z-index: 100; }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal { width: min(700px, 100%); background: white; border-radius: 20px 20px 0 0; padding: 30px; transform: translateY(100%); transition: 0.4s; max-height: 90vh; overflow-y: auto; position: relative; }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-close { position: absolute; top: 20px; right: 20px; border: 0; background: #eee; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; }
    .modal-head { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
    .modal-head-img { width: 100px; height: 100px; background: #f0f0f0; border-radius: 12px; display: grid; place-items: center; }
    .modal-head-img img { max-width: 100%; max-height: 100%; }
    .modal-head-text h2 { margin: 0; font-size: 1.8rem; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .info-box { background: #f9f9f9; padding: 15px; border-radius: 12px; }
    .info-box strong { display: block; font-size: 0.8rem; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
    .setup-box { background: #eaf6f3; padding: 20px; border-radius: 12px; border: 1px solid #ccebe2; }
    .setup-box h4 { color: #087f8c; margin: 0 0 10px; }
    .setup-item { margin-bottom: 8px; font-size: 0.95rem; }
    .setup-item strong { color: #087f8c; }

    @media (max-width: 600px) {
      .hero h1 { font-size: 1.8rem; }
      .info-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="#">АкваДом</a>
      <div class="nav-links">
        <a href="#">Каталог</a>
        <a href="#">Оборудование</a>
        <a href="#">Болезни</a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1>Энциклопедия аквариумных рыб</h1>
      <p>Выбирай рыбу и узнавай, как обустроить для неё идеальный дом</p>
    </div>
  </section>

  <main class="container">
    <div class="grid" id="fishGrid"></div>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-head">
        <div class="modal-head-img" id="modalPhoto"></div>
        <div class="modal-head-text">
          <h2 id="modalName"></h2>
          <div id="modalLatin" style="color: #777; font-style: italic;"></div>
        </div>
      </div>
      <p id="modalDesc" style="color: #555;"></p>
      <div class="info-grid">
        <div class="info-box"><strong>Объем</strong><span id="modalVolume"></span></div>
        <div class="info-box"><strong>Температура</strong><span id="modalTemp"></span></div>
        <div class="info-box"><strong>pH / GH</strong><span id="modalWater"></span></div>
        <div class="info-box"><strong>Совместимость</strong><span id="modalCompat"></span></div>
      </div>
      <div class="setup-box">
        <h4>🛠 Как обустроить аквариум</h4>
        <div class="setup-item"><strong>Грунт:</strong> <span id="setupGround"></span></div>
        <div class="setup-item"><strong>Растения:</strong> <span id="setupPlants"></span></div>
        <div class="setup-item"><strong>Декор:</strong> <span id="setupDecor"></span></div>
        <div class="setup-item"><strong>Оборудование:</strong> <span id="setupTech"></span></div>
      </div>
    </div>
  </div>

  <script>
    // Массив с данными. Пока 5 рыб для теста работоспособности.
    const fishData = [
      {
        name: "Гуппи", latin: "Poecilia reticulata", icon: "🐟",
        desc: "Живородящая рыбка, идеальна для новичков. Самцы ярче, самки крупнее.",
        volume: "30 л на стаю", temp: "22–26°C", water: "pH 6.5–7.5, GH 5–15", compat: "С любыми мирными рыбами",
        setupGround: "Мелкий темный гравий или песок.",
        setupPlants: "Валлиснерия, роголистник, пистия для укрытия мальков.",
        setupDecor: "Коряги, гроты.",
        setupTech: "Свет 8 часов. Простой внутренний фильтр."
      },
      {
        name: "Гурами медовый", latin: "Trichogaster chuna", icon: "🐠",
        desc: "Спокойная лабиринтовая рыбка. Имеет красивый медовый окрас.",
        volume: "40 л на пару", temp: "24–28°C", water: "pH 6.0–7.5, GH 5–15", compat: "С мирными рыбами",
        setupGround: "Мелкий песок или гравий.",
        setupPlants: "Плавающие растения (риччия, пистия), густые заросли.",
        setupDecor: "Керамические горшки, коряги.",
        setupTech: "Свет приглушенный. Фильтр без сильного течения."
      },
      {
        name: "Петушок", latin: "Betta splendens", icon: "🐟",
        desc: "Одиночная рыбка с роскошными плавниками. Дышит воздухом.",
        volume: "15–20 л на одного", temp: "24–28°C", water: "pH 6.0–7.5, GH 3–12", compat: "Только один самец",
        setupGround: "Любой нейтральный грунт.",
        setupPlants: "Анубиасы, мох, плавающие растения.",
        setupDecor: "Гроты, коряги.",
        setupTech: "Слабый фильтр! Обогреватель обязателен."
      },
      {
        name: "Золотая рыбка", latin: "Carassius auratus", icon: "🐠",
        desc: "Крупная холодноводная рыба. Очень прожорлива.",
        volume: "50 л на 1 рыбу", temp: "18–24°C", water: "pH 6.5–8.0, GH 5–20", compat: "С холодноводными",
        setupGround: "Крупный гладкий гравий.",
        setupPlants: "Жесткие растения (анубиасы).",
        setupDecor: "Крупные камни.",
        setupTech: "Мощный внешний фильтр! Свет яркий."
      },
      {
        name: "Скалярия", latin: "Pterophyllum scalare", icon: "🐟",
        desc: "Величественная цихлида. Нужен высокий аквариум.",
        volume: "100 л на пару", temp: "24–28°C", water: "pH 6.0–7.5, GH 5–15", compat: "С гурами, тетрами",
        setupGround: "Мелкий песок.",
        setupPlants: "Крупные растения (эхинодорусы).",
        setupDecor: "Вертикальные коряги.",
        setupTech: "Высокий аквариум. Фильтр умеренный."
      }
    ];

    const fishGrid = document.getElementById("fishGrid");
    const overlay = document.getElementById("modalOverlay");

    function renderGrid() {
      fishGrid.innerHTML = fishData.map((fish, i) => `
        <article class="card" onclick="openModal(${i})">
          <div class="card-img">
            <div style="font-size:4rem">${fish.icon}</div>
          </div>
          <div class="card-body">
            <div class="card-title">${fish.name}</div>
            <div class="card-desc">${fish.latin}</div>
            <button class="btn-view">Подробнее</button>
          </div>
        </article>
      `).join("");
    }

    function openModal(index) {
      const f = fishData[index];
      if (!f) return;
      
      document.getElementById("modalPhoto").innerHTML = `<div style="font-size:3rem">${f.icon}</div>`;
      document.getElementById("modalName").textContent = f.name;
      document.getElementById("modalLatin").textContent = f.latin;
      document.getElementById("modalDesc").textContent = f.desc;
      
      document.getElementById("modalVolume").textContent = f.volume;
      document.getElementById("modalTemp").textContent = f.temp;
      document.getElementById("modalWater").textContent = f.water;
      document.getElementById("modalCompat").textContent = f.compat;
      
      document.getElementById("setupGround").textContent = f.setupGround;
      document.getElementById("setupPlants").textContent = f.setupPlants;
      document.getElementById("setupDecor").textContent = f.setupDecor;
      document.getElementById("setupTech").textContent = f.setupTech;
      
      overlay.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      overlay.classList.remove("open");
      document.body.style.overflow = "";
    }

    document.getElementById("modalClose").addEventListener("click", closeModal);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

    renderGrid();
  </script>
</body>
</html>
